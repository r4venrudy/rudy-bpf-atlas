name: Package release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build and test
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build --build-config Release --output-on-failure
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          if [[ "$RUNNER_OS" == "Windows" ]]; then cp build/Release/rudy-bpf-atlas.exe stage/; else cp build/rudy-bpf-atlas stage/; fi
          cp README.md LICENSE stage/
      - name: Create archive
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cd stage
            cmake -E tar cfv "../rudy-bpf-atlas-${{ matrix.name }}.zip" --format=zip .
          else
            tar -czf "rudy-bpf-atlas-${{ matrix.name }}.tar.gz" -C stage .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rudy-bpf-atlas-${{ matrix.name }}
          path: rudy-bpf-atlas-${{ matrix.name }}.*
          if-no-files-found: error
  release:
    needs: package
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets
          pattern: rudy-bpf-atlas-*
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum rudy-bpf-atlas-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          prerelease: true
          files: assets/*
